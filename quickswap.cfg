[quickswap]

[gcode_macro _QS_A_CHANGE_FILAMENT]
# On klippy:ready, quickswap.py renames:
#  _A_CHANGE_FILAMENT to _QS_ORIG_A_CHANGE_FILAMENT
#  _QS_A_CHANGE_FILAMENT (this macro) to _A_CHANGE_FILAMENT
gcode:
    {% set channel = params.CHANNEL|default(0)|int %}
    {% set switchover = params.SWITCHOVER|default(0)|int %}

    {% set restore_temp = params.RESTORE_TEMP|default(0)|int %}
    {% set restore_position = params.RESTORE_POSITION|default(0)|int %}
    {% set use_trash_on_print = printer.save_variables.variables['use_trash_on_print']|default(1)|int %}
    {% set printer_state = printer.print_stats.state %}

    # GCode-invoked change: restore_temp = 1, restore_position = 1 :: This is the target.
    # zmod_ifs.ANALOG_PRUTOK: restore_temp = 1, restore_position = 0 :: Let the default behavior take over here. I looked at implementing my own but decided it wasn't worth the hassle.
    # zmod_ifs.SET_CURRENT_PRUTOK: restore_temp = 0, restore_position = 0 :: SET_CURRENT_PRUTOK itself is only called in situations that either are bypassed by QuickSwap, or that QuickSwap would let fall back to stock behavior anyway.

    {% if (printer_state != 'printing' or use_trash_on_print == 1 or restore_temp == 0 or restore_position == 0) and switchover == 0 %}
        # Basically - anything except a completely straightforward mid-print color change, we fall back to default behavior.
        _QS_ORIG_A_CHANGE_FILAMENT {rawparams}
    {% else %}
        _QS_CHANGE_FILAMENT CHANNEL={channel} SWITCHOVER={switchover}
        SET_GCODE_VARIABLE MACRO=_A_CHANGE_FILAMENT VARIABLE=purge VALUE=0
    {% endif %}

[gcode_macro _QS_OUTPUT_GCODE]
gcode:
    {% set channel = params.CHANNEL|default(0)|int %}
    _QS_GENERATE_TEST CHANNEL={channel}

[gcode_macro QS_IFS_CALIBRATION_SPEED]
gcode:
    {% set channel = params.CHANNEL|default(0)|int %}
    {% set min_speed = params.MIN_SPEED|default(300)|int %}
    {% set max_speed = params.MAX_SPEED|default(2400)|int %}
    {% set speed_step = params.SPEED_STEP|default(300)|int %}
    {% set test_length = params.TEST_LENGTH|default(100)|int %}
    {% set tolerance = params.TOLERANCE|default(2)|int %}
    {% set tube_flex = params.TUBE_FLEX|default(-1)|int %}

    {% if channel > 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin IFS Calibration - Speed"
        RESPOND TYPE=command MSG="action:prompt_text Running speed calibration on IFS channel {channel}"
        RESPOND TYPE=command MSG="action:prompt_text Min speed {min_speed}, max speed {max_speed}, step {speed_step}"
        RESPOND TYPE=command MSG="action:prompt_text Test length {test_length}mm, tolerance +/- {tolerance}mm"
        {% if tube_flex >= 0 %}
            RESPOND TYPE=command MSG="action:prompt_text Tube flex length {tube_flex}mm"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_text "
        RESPOND TYPE=command MSG="action:prompt_text Please ensure the extruder is not loaded before continuing."
        RESPOND TYPE=command MSG="action:prompt_footer_button Continue|_QS_IFS_CALIBRATION_SPEED {rawparams}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|action:prompt_end|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND MSG="Invalid channel"
    {% endif %}
